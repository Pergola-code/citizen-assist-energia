<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Citizen Assist AI · Energia</title>
<style>
  :root {
    --bg: #f6f4ef; --card: #ffffff; --ink: #1d1b16; --ink2: #5d5a52; --line: #e3dfd5;
    --accent: #1f6f5c; --accent-ink: #ffffff; --sun: #f2b134; --sun-bg: #fff4d6;
    --user: #1f6f5c; --user-ink: #ffffff; --warn-bg: #fdf1ec; --warn: #9a3d16;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14161a; --card: #1e2127; --ink: #eceae4; --ink2: #a9a69c; --line: #2f333b;
      --accent: #3fae90; --accent-ink: #0b1411; --sun: #f2b134; --sun-bg: #3a3017;
      --user: #2c8a72; --user-ink: #ffffff; --warn-bg: #3a231a; --warn: #f0a07c;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--ink);
    font: 17px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column;
  }
  header {
    background: var(--accent); color: var(--accent-ink); padding: 14px 16px;
    display: flex; align-items: center; gap: 12px; box-shadow: 0 1px 0 rgba(0,0,0,.08);
  }
  .logo { width: 38px; height: 38px; border-radius: 50%; background: var(--sun);
          display: grid; place-items: center; flex: none; }
  header h1 { font-size: 18px; margin: 0; line-height: 1.2; }
  header p { margin: 2px 0 0; font-size: 14px; opacity: .9; }
  main { flex: 1; overflow-y: auto; padding: 16px; }
  .conversa { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
  .msg { max-width: 92%; padding: 12px 14px; border-radius: 16px; }
  .msg.user { align-self: flex-end; background: var(--user); color: var(--user-ink); border-bottom-right-radius: 4px; }
  .msg.bot { align-self: flex-start; background: var(--card); border: 1px solid var(--line); border-bottom-left-radius: 4px; }
  .resumo { background: var(--sun-bg); border-left: 4px solid var(--sun); padding: 10px 12px;
            border-radius: 8px; font-weight: 600; margin-bottom: 10px; }
  .texto { white-space: pre-wrap; }
  details { margin-top: 10px; border-top: 1px solid var(--line); padding-top: 8px; }
  summary { cursor: pointer; color: var(--ink2); font-size: 15px; font-weight: 600; }
  details.atencao summary { color: var(--warn); }
  details ul { margin: 8px 0 0; padding-left: 20px; font-size: 15px; color: var(--ink2); }
  details li { margin-bottom: 4px; }
  a { color: var(--accent); }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; max-width: 760px; margin: 0 auto; padding: 0 16px 10px; }
  @media (max-width: 600px) {
    .chips { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; }
    .chip { flex: none; }
  }
  /* Tela larga: atalhos numa coluna lateral, sobra mais espaço para a conversa. */
  @media (min-width: 1000px) {
    .chips { position: fixed; top: 92px; left: max(16px, calc(50% - 640px)); width: 230px;
             flex-direction: column; align-items: stretch; padding: 0; margin: 0; }
    .chips::before { content: "Perguntas rápidas"; font-size: 13px; font-weight: 600; color: var(--ink2);
                     text-transform: uppercase; letter-spacing: .04em; margin-bottom: 2px; }
    .chip { text-align: left; }
    main, form.entrada { padding-left: 270px; }
    .conversa { margin: 0 auto 0 0; }
    form.entrada { max-width: 1046px; margin: 0; }
    .rodape { padding-left: max(0px, calc(50% - 640px)); }
  }
  .chip { border: 1px solid var(--accent); color: var(--accent); background: var(--card); border-radius: 999px;
          padding: 8px 14px; font: inherit; font-size: 15px; cursor: pointer; }
  .chip:hover, .chip:focus-visible { background: var(--accent); color: var(--accent-ink); outline: none; }
  form.entrada { display: flex; gap: 8px; padding: 10px 16px 16px; max-width: 792px; margin: 0 auto; width: 100%; }
  form.entrada input { flex: 1; min-width: 0; font: inherit; padding: 12px 14px; border-radius: 12px;
                       border: 1px solid var(--line); background: var(--card); color: var(--ink); }
  button.enviar { font: inherit; font-weight: 600; border: 0; border-radius: 12px; padding: 0 18px;
                  background: var(--accent); color: var(--accent-ink); cursor: pointer; }
  .rodape { background: var(--bg); border-top: 1px solid var(--line); padding-top: 10px; }
  .sim { display: grid; gap: 10px; }
  .sim label { display: grid; gap: 4px; font-size: 15px; color: var(--ink2); }
  .sim input[type=number] { font: inherit; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line);
                            background: var(--bg); color: var(--ink); width: 140px; }
  .sim .linha { display: flex; align-items: center; gap: 8px; color: var(--ink); font-size: 16px; }
  .sim .linha input { width: 20px; height: 20px; }
  .sim button { justify-self: start; }
  .erro { color: var(--warn); background: var(--warn-bg); padding: 8px 10px; border-radius: 8px; }
  .digitando { color: var(--ink2); font-style: italic; }
</style>
</head>
<body>
<header>
  <div class="logo" aria-hidden="true">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1d1b16" stroke-width="2" stroke-linecap="round">
      <circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
    </svg>
  </div>
  <div>
    <h1>Citizen Assist AI · Energia</h1>
    <p>Gaste menos com o chuveiro elétrico</p>
  </div>
</header>

<main id="rolagem" aria-live="polite">
  <div class="conversa" id="conversa"></div>
</main>

<div class="rodape">
  <div class="chips" id="chips">
    <button class="chip" data-p="Quanto meu chuveiro gasta?">Quanto meu chuveiro gasta?</button>
    <button class="chip" data-p="Como pagar menos?">Como pagar menos?</button>
    <button class="chip" data-p="Vale a pena aquecedor solar?">Aquecedor solar</button>
    <button class="chip" data-p="Placa solar zera a conta?">Placa solar zera a conta?</button>
    <button class="chip" data-p="Moro de aluguel, o que dá pra fazer?">Moro de aluguel</button>
    <button class="chip" data-p="Compare as opções">Comparar opções</button>
    <button class="chip" data-acao="simular">Simular minha casa</button>
  </div>
  <form class="entrada" id="form">
    <label for="pergunta" style="position:absolute;left:-9999px">Sua pergunta</label>
    <input id="pergunta" autocomplete="off" placeholder="Escreva sua pergunta…" maxlength="500">
    <button class="enviar" type="submit">Enviar</button>
  </form>
</div>

<script>
const conversa = document.getElementById("conversa");
const rolagem = document.getElementById("rolagem");

function rolar() { rolagem.scrollTop = rolagem.scrollHeight; }

function balao(tipo) {
  const d = document.createElement("div");
  d.className = "msg " + tipo;
  conversa.appendChild(d);
  rolar();
  return d;
}

function mensagemUsuario(texto) { balao("user").textContent = texto; }

// Monta a resposta: resumo em destaque, texto, e "Atenção"/"Fontes" recolhíveis.
// Tudo com textContent (nunca innerHTML) para não executar nada vindo do texto.
function mensagemBot(r) {
  const b = balao("bot");
  if (r.resumo) {
    const res = document.createElement("div");
    res.className = "resumo";
    res.textContent = r.resumo.charAt(0).toUpperCase() + r.resumo.slice(1);
    b.appendChild(res);
  }
  const t = document.createElement("div");
  t.className = "texto";
  t.textContent = r.texto;
  b.appendChild(t);
  if (r.limitacoes && r.limitacoes.length) b.appendChild(lista("Atenção: são estimativas", r.limitacoes, "atencao"));
  if (r.fontes && r.fontes.length) b.appendChild(lista("De onde vêm esses números", r.fontes, "fontes"));
  rolar();
}

function lista(titulo, itens, classe) {
  const det = document.createElement("details");
  det.className = classe;
  if (classe === "atencao") det.open = true;
  const s = document.createElement("summary");
  s.textContent = titulo + " (" + itens.length + ")";
  det.appendChild(s);
  const ul = document.createElement("ul");
  for (const it of itens) {
    const li = document.createElement("li");
    if (typeof it === "string") li.textContent = it;
    else {
      const a = document.createElement("a");
      a.href = it.url; a.target = "_blank"; a.rel = "noopener";
      a.textContent = "[" + it.id + "] " + it.titulo;
      li.appendChild(a);
    }
    ul.appendChild(li);
  }
  det.appendChild(ul);
  return det;
}

function erro(texto) {
  const b = balao("bot");
  const e = document.createElement("div");
  e.className = "erro"; e.textContent = texto;
  b.appendChild(e);
}

async function chamar(rota, dados) {
  const espera = balao("bot");
  espera.innerHTML = '<span class="digitando">Calculando…</span>';
  try {
    const resp = await fetch(rota, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(dados) });
    const json = await resp.json();
    espera.remove();
    if (!resp.ok) return erro(json.erro || "Algo deu errado.");
    mensagemBot(json);
  } catch (e) {
    espera.remove();
    erro("Não consegui falar com o servidor. Ele está rodando?");
  }
}

function perguntar(texto) {
  texto = texto.trim();
  if (!texto) return;
  if (/simul/i.test(texto)) return abrirSimulacao();
  mensagemUsuario(texto);
  chamar("/api/perguntar", { mensagem: texto });
}

function abrirSimulacao() {
  mensagemUsuario("Simular minha casa");
  const b = balao("bot");
  b.innerHTML = `
    <div class="resumo">Vamos calcular com os dados da sua casa.</div>
    <form class="sim">
      <label>Quantas pessoas tomam banho na casa?<input type="number" name="pessoas" value="4" min="1" max="20" required></label>
      <label>Quantos minutos dura cada banho, em média?<input type="number" name="minutos" value="8" min="1" max="60" step="0.5" required></label>
      <label>Consumo da casa no mês, em kWh (está na conta de luz, no campo "Consumo")
        <input type="number" name="consumo" min="10" max="2000" placeholder="ex.: 220"></label>
      <label class="linha"><input type="checkbox" name="nao_sei"> Não sei o consumo (vou estimar)</label>
      <label class="linha"><input type="checkbox" name="tarifa_social"> Tenho Tarifa Social / Baixa Renda na conta</label>
      <label class="linha"><input type="checkbox" name="casa_propria" checked> Moro em casa própria, com telhado</label>
      <button class="enviar" type="submit" style="padding:10px 18px">Calcular</button>
    </form>`;
  const f = b.querySelector("form");
  f.addEventListener("submit", ev => {
    ev.preventDefault();
    const d = new FormData(f);
    const naoSei = d.get("nao_sei") === "on" || !d.get("consumo");
    chamar("/api/simular", {
      pessoas: d.get("pessoas"), minutos: d.get("minutos"),
      consumo: naoSei ? "nao_sei" : d.get("consumo"),
      tarifa_social: d.get("tarifa_social") === "on",
      casa_propria: d.get("casa_propria") === "on",
    });
  });
  rolar();
}

document.getElementById("form").addEventListener("submit", ev => {
  ev.preventDefault();
  const campo = document.getElementById("pergunta");
  perguntar(campo.value);
  campo.value = "";
});
document.getElementById("chips").addEventListener("click", ev => {
  const c = ev.target.closest(".chip");
  if (!c) return;
  if (c.dataset.acao === "simular") abrirSimulacao(); else perguntar(c.dataset.p);
});

mensagemBot({
  resumo: "olá! Eu ajudo você a gastar menos com o chuveiro elétrico.",
  texto: "Toque em uma das perguntas abaixo ou escreva do seu jeito. Também posso calcular com os dados da sua casa: toque em \"Simular minha casa\".\n\nTodos os números são estimativas com fontes públicas, não promessa de economia.",
});
</script>
</body>
</html>
